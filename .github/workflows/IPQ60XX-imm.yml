name: IPQ60XX-imm

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/immortalwrt.git
      repo_branch: openwrt-25.12
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX-imm-nowifi
      kernel_file: kernel-6.18
      artifact_prefix: IPQ60XX-nowifi-imm
      manifest_file: immortalwrt-qualcommax-ipq60xx.manifest
      release_summary: >-
        这是开启全功能NSS的6.12内核固件，默认主题为Aurora；该固件在ImmortalWrt的基础上，nowifi 具体详见IPQ60XX.config和General.config。
